<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengalihkan ke Aplikasi Web...</title>
    <!-- Meta Refresh Fallback setelah 5 detik -->
    <meta http-equiv="refresh" content="5;url=https://script.google.com/macros/s/AKfycbwzOm41_9U0eALLk84vTt_I2h6-Kud3v8ST2hGSWEAWcomgdRnHqIEq4R6vn_5U-IQnrA/exec">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-mesh {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
        }
        .light .bg-mesh {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.08) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh min-h-screen flex flex-col justify-between items-center p-4 transition-colors duration-300 text-slate-100 dark:text-slate-100 light:text-slate-800">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4 px-2">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-500 font-bold text-xl shadow-lg">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <span class="font-semibold text-lg tracking-tight dark:text-white text-slate-800">Web Portal</span>
        </div>

        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl bg-slate-800/60 dark:bg-slate-800/60 border border-slate-700/50 dark:border-slate-700/50 text-slate-300 hover:text-white hover:bg-slate-700/50 transition-all duration-200">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md my-auto py-8">
        <div class="relative group">
            <!-- Glow Effect Outer -->
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl blur opacity-30 group-hover:opacity-50 transition duration-1000 group-hover:duration-200 animate-pulse-slow"></div>

            <!-- Card Inner -->
            <div class="relative bg-slate-900/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-800 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl text-center flex flex-col items-center">
                
                <!-- Animated App Icon -->
                <div class="relative mb-6">
                    <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-3xl shadow-xl shadow-blue-500/20 animate-float">
                        <i class="fa-solid fa-rocket"></i>
                    </div>
                    <span class="flex h-4 w-4 absolute -top-1 -right-1">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-slate-900"></span>
                    </span>
                </div>

                <!-- Title & Description -->
                <h1 class="text-2xl font-bold tracking-tight mb-2 text-white dark:text-white">
                    Mengalihkan Halaman
                </h1>
                <p class="text-slate-400 text-sm mb-6 max-w-xs leading-relaxed">
                    Anda sedang berada di jalur pengalihan resmi menuju sistem web. Mohon tunggu sebentar.
                </p>

                <!-- Progress & Timer Box -->
                <div class="w-full bg-slate-800/80 rounded-xl p-4 mb-6 border border-slate-700/50">
                    <div class="flex justify-between items-center mb-2 text-xs font-medium">
                        <span class="text-slate-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-spinner animate-spin text-blue-400"></i>
                            Proses Pengalihan
                        </span>
                        <span id="countdownText" class="text-blue-400 font-bold">3 Detik</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-slate-700/50 h-2 rounded-full overflow-hidden">
                        <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-100 ease-linear rounded-full"></div>
                    </div>
                </div>

                <!-- Direct Action Button -->
                <a href="https://script.google.com/macros/s/AKfycbwzOm41_9U0eALLk84vTt_I2h6-Kud3v8ST2hGSWEAWcomgdRnHqIEq4R6vn_5U-IQnrA/exec" 
                   id="redirectBtn"
                   class="w-full group/btn relative inline-flex items-center justify-center px-6 py-3.5 text-base font-semibold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 overflow-hidden mb-3">
                    <span class="relative flex items-center gap-2">
                        Buka Aplikasi Sekarang
                        <i class="fa-solid fa-arrow-right transition-transform group-hover/btn:translate-x-1"></i>
                    </span>
                </a>

                <!-- Control Buttons Grid -->
                <div class="grid grid-cols-2 gap-2 w-full text-xs font-medium">
                    <!-- Pause/Resume Button -->
                    <button id="pauseBtn" onclick="toggleTimer()" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700/60 rounded-lg text-slate-300 hover:text-white transition flex items-center justify-center gap-1.5">
                        <i id="pauseIcon" class="fa-solid fa-pause"></i>
                        <span id="pauseText">Tahan Timer</span>
                    </button>

                    <!-- Copy Link Button -->
                    <button onclick="copyURL()" class="py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700/60 rounded-lg text-slate-300 hover:text-white transition flex items-center justify-center gap-1.5">
                        <i class="fa-regular fa-copy"></i>
                        <span>Salin Link</span>
                    </button>
                </div>

                <!-- Security & Status Info -->
                <div class="mt-6 pt-4 border-t border-slate-800/80 w-full flex items-center justify-center gap-4 text-xs text-slate-500">
                    <span class="flex items-center gap-1 text-emerald-400">
                        <i class="fa-solid fa-shield-halved"></i> SSL Encrypted
                    </span>
                    <span>•</span>
                    <span class="flex items-center gap-1">
                        <i class="fa-brands fa-google"></i> Google Web App
                    </span>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl text-center py-4 text-xs text-slate-500">
        <p>&copy; <span id="year"></span> Redirect Service. Semua hak dilindungi.</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-800 text-white px-4 py-3 rounded-xl border border-slate-700 shadow-2xl flex items-center gap-3 z-50">
        <i id="toastIcon" class="fa-solid fa-check text-emerald-400 text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium">Teks berhasil disalin!</span>
    </div>

    <script>
        const TARGET_URL = "https://script.google.com/macros/s/AKfycbwzOm41_9U0eALLk84vTt_I2h6-Kud3v8ST2hGSWEAWcomgdRnHqIEq4R6vn_5U-IQnrA/exec";
        const TOTAL_SECONDS = 3;
        
        let remainingSeconds = TOTAL_SECONDS;
        let isPaused = false;
        let timerInterval = null;

        const countdownText = document.getElementById('countdownText');
        const progressBar = document.getElementById('progressBar');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseIcon = document.getElementById('pauseIcon');
        const pauseText = document.getElementById('pauseText');

        // Set Current Year in Footer
        document.getElementById('year').textContent = new Date().getFullYear();

        function startCountdown() {
            const step = 50; // update UI every 50ms for smooth bar
            const totalSteps = (TOTAL_SECONDS * 1000) / step;
            let currentStep = 0;

            timerInterval = setInterval(() => {
                if (!isPaused) {
                    currentStep++;
                    
                    // Update Progress Bar
                    const progressPercent = Math.min((currentStep / totalSteps) * 100, 100);
                    progressBar.style.width = `${progressPercent}%`;

                    // Update Seconds Text
                    const leftSec = Math.ceil(TOTAL_SECONDS - (currentStep * step / 1000));
                    if (leftSec > 0) {
                        countdownText.textContent = `${leftSec} Detik`;
                    } else {
                        countdownText.textContent = `Mengalihkan...`;
                    }

                    // Redirect when completed
                    if (currentStep >= totalSteps) {
                        clearInterval(timerInterval);
                        window.location.href = TARGET_URL;
                    }
                }
            }, step);
        }

        function toggleTimer() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseIcon.className = 'fa-solid fa-play';
                pauseText.textContent = 'Lanjutkan Timer';
                countdownText.textContent = 'Diberhentikan';
                showToast('Timer dihentikan sementara', 'info');
            } else {
                pauseIcon.className = 'fa-solid fa-pause';
                pauseText.textContent = 'Tahan Timer';
                showToast('Timer dilanjutkan', 'info');
            }
        }

        function copyURL() {
            // Using execCommand fallback for seamless copy in iframe / sandbox environments
            const tempInput = document.createElement('input');
            tempInput.value = TARGET_URL;
            document.body.appendChild(tempInput);
            tempInput.select();
            
            try {
                document.execCommand('copy');
                showToast('Link Web App berhasil disalin!', 'success');
            } catch (err) {
                showToast('Gagal menyalin link', 'error');
            }
            
            document.body.removeChild(tempInput);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
            }

            // Show Toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            // Hide Toast after 3s
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Countdown on window load
        window.onload = function() {
            startCountdown();
        };
    </script>
</body>
</html>
